<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ライブ翻訳ノート</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>🎧 ライブ翻訳ノート <small>開発版</small></h1>
  <label>音声の取り込み
    <select id="source">
      <option value="mic">マイク（スピーカーの音を拾う）</option>
      <option value="display">画面・タブの音声を直接</option>
    </select>
  </label>
  <label>話している言語
    <select id="srcLang">
      <option value="en-US|en">英語（米）</option>
      <option value="en-GB|en">英語（英）</option>
    </select>
  </label>
  <label>要約
    <select id="sumEvery">
      <option value="0">しない</option>
      <option value="5" selected>5分ごと</option>
      <option value="10">10分ごと</option>
    </select>
  </label>
  <button id="prep">翻訳・要約の準備</button>
  <button id="start" class="primary">▶ 開始</button>
  <button id="stop" class="stop" disabled>■ 停止</button>
  <span class="spacer"></span>
  <button id="fsDown">A−</button><button id="fsUp">A＋</button>
  <button id="toggleSrc">原文を隠す</button>
  <button id="save">💾 保存</button>
  <button id="clear">クリア</button>
  <a class="link" href="check.html" target="_blank" rel="noopener">動作確認</a>
</header>
<div class="status">
  <span><span id="dRec" class="dot"></span>音声認識: <b id="sRec">待機中</b></span>
  <span><span id="dTr" class="dot"></span>翻訳: <b id="sTr">未確認</b></span>
  <span><span id="dSum" class="dot"></span>要約: <b id="sSum">未確認</b></span>
  <span>経過: <b id="elapsed">00:00</b></span>
</div>
<main>
  <section id="log">
    <div id="list"><div class="empty">
      使い方<br>
      ①「翻訳・要約の準備」を一度押す（初回のみAIモデルをダウンロード）<br>
      ② 音声の取り込み方を選んで「▶ 開始」<br>
      ・<b>マイク</b>：PCのスピーカーから出る音をマイクで拾います<br>
      ・<b>画面・タブの音声を直接</b>：共有ダイアログで「タブ」または「画面全体」を選び、<b>「音声も共有する」をオン</b>にします<br>
      うまく動かないときは、右上の「動作確認」でこのブラウザの対応状況を確認してください。
    </div></div>
    <div id="interim"></div>
  </section>
  <aside>
    <h2>📝 要約 <button id="sumNow">今すぐ要約</button></h2>
    <div id="sums"><div class="empty">要約はここに表示されます。</div></div>
    <div class="ad">広告枠（ここに広告を表示する想定）</div>
  </aside>
</main>
<div id="msg"></div>
<script src="js/app.js"></script>
</body>
</html>
